<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TabBar Icons Export</title>
<style>
  body { background: #fff; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
  .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  canvas { border: 1px solid #eee; }
  p { font-size: 12px; color: #666; margin: 0; }
</style>
</head>
<body>
<script>
const icons = [
  { name: 'home', active: false },
  { name: 'home-active', active: true },
  { name: 'profile', active: false },
  { name: 'profile-active', active: true },
];

icons.forEach(({name, active}) => {
  const canvas = document.createElement('canvas');
  canvas.width = 81;
  canvas.height = 81;
  const ctx = canvas.getContext('2d');
  const color = active ? '#EAB308' : '#999999';
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (name.startsWith('home')) {
    // House icon
    ctx.beginPath();
    ctx.moveTo(40.5, 10);
    ctx.lineTo(70, 38);
    ctx.lineTo(70, 68);
    ctx.lineTo(52, 68);
    ctx.lineTo(52, 50);
    ctx.lineTo(29, 50);
    ctx.lineTo(29, 68);
    ctx.lineTo(11, 68);
    ctx.lineTo(11, 38);
    ctx.closePath();
    ctx.stroke();
    if (active) ctx.fill();
  } else {
    // Person icon
    ctx.beginPath();
    ctx.arc(40.5, 28, 14, 0, Math.PI * 2);
    ctx.stroke();
    if (active) ctx.fill();
    ctx.beginPath();
    ctx.arc(40.5, 75, 24, Math.PI, 0);
    ctx.stroke();
    if (active) ctx.fill();
  }

  const wrap = document.createElement('div');
  wrap.className = 'icon-wrap';
  const p = document.createElement('p');
  p.textContent = name + '.png (81x81)';
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = name + '.png';
  link.textContent = '下载 ' + name + '.png';
  link.style.fontSize = '12px';
  wrap.appendChild(canvas);
  wrap.appendChild(p);
  wrap.appendChild(link);
  document.body.appendChild(wrap);
});
</script>
</body>
</html>
